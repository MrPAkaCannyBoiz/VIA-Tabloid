name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        working-directory: via-tabloid-spring-boot
        run: mvn test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: via-tabloid-spring-boot/Dockerfile
          tags: via-tabloid-spring-boot:latest
          push: false
          outputs: type=docker,dest=/tmp/backend.tar

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          tags: via-tabloid-frontend:latest
          push: false
          outputs: type=docker,dest=/tmp/frontend.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: /tmp/backend.tar

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-image
          path: /tmp/frontend.tar

  cd:
    name: Deploy to Minikube
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Download backend image
        uses: actions/download-artifact@v4
        with:
          name: backend-image
          path: /tmp

      - name: Download frontend image
        uses: actions/download-artifact@v4
        with:
          name: frontend-image
          path: /tmp

      - name: Load images into Minikube
        run: |
          minikube image load /tmp/backend.tar
          minikube image load /tmp/frontend.tar

      - name: Create k8s/secrets.env from GitHub Secrets
        run: |
          cat > k8s/secrets.env <<EOF
          DB_USERNAME=${{ secrets.DB_USERNAME }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_URL_DOCKER=${{ secrets.DB_URL_DOCKER }}
          EOF

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/

      - name: Wait for backend rollout
        run: kubectl rollout status deployment/via-tabloid-spring-boot --timeout=120s

      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --timeout=120s

      - name: Verify pods
        run: kubectl get pods
