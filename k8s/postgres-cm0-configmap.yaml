apiVersion: v1
data:
  init.sql: |+
    create table departments
    (
        id   integer generated by default as identity
            primary key,
        name varchar(255)
    );

    alter table departments
        owner to postgres;

    create table stories
    (
        id            integer generated by default as identity
            primary key,
        created_at    timestamp(6),
        description   varchar(255),
        title         varchar(255),
        department_id integer
            constraint fktktgvewo7t8gx6tv7gan2rdw1
                references departments
    );

    alter table stories
        owner to postgres;

    insert into departments (name) values
        ('Software Engineer'),
        ('Climate and Supply'),
        ('Construction');

kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: postgres
  name: postgres-cm0
