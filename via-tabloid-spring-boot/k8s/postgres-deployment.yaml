apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (9532ceef3)
  labels:
    io.kompose.service: postgres
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (9532ceef3)
      labels:
        io.kompose.service: postgres
    spec:
      containers:
        - env:
            - name: POSTGRES_DB
              value: via_tabloid
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: via-tabloid-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: via-tabloid-secrets
                  key: DB_USERNAME
          image: postgres:latest
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'pg_isready -U $POSTGRES_USER'
            failureThreshold: 5
            periodSeconds: 5
            timeoutSeconds: 5
          name: postgres-via-tabloid
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: postgres-cm0
              subPath: init.sql
      restartPolicy: Always
      volumes:
        - configMap:
            items:
              - key: init.sql
                path: init.sql
            name: postgres-cm0
          name: postgres-cm0
